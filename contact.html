  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | ZionFlow</title>

  <meta name="description" content="Contact ZionFlow to discuss remote administrative and lead-support services for real-estate professionals across South Africa.">

  <style>
    :root {
      --navy: #17243d;
      --navy-dark: #0d1729;
      --gold: #c9a94a;
      --cream: #f7f3e9;
      --white: #ffffff;
      --text: #263044;
      --muted: #697386;
      --border: #dedbd2;
      --success: #28734b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--cream);
      line-height: 1.7;
    }

    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.15;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: auto;
    }

    header {
      background: rgba(247,243,233,.97);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: bold;
      color: var(--navy);
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-cta {
      background: var(--gold);
      color: var(--navy-dark) !important;
      padding: 12px 18px;
      border-radius: 4px;
    }

    .hero {
      background: var(--navy);
      color: white;
      text-align: center;
      padding: 95px 0;
    }

    .eyebrow {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hero h1 {
      color: white;
      font-size: clamp(44px, 7vw, 68px);
      margin-bottom: 25px;
    }

    .hero p {
      max-width: 700px;
      margin: auto;
      color: #d9dfeb;
      font-size: 18px;
    }

    section {
      padding: 90px 0;
    }

    .contact-section {
      background: var(--cream);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 60px;
      align-items: start;
    }

    .contact-info h2 {
      color: var(--navy);
      font-size: 42px;
      margin-bottom: 20px;
    }

    .contact-info > p {
      color: var(--muted);
      margin-bottom: 35px;
    }

    .info-item {
      border-top: 1px solid var(--border);
      padding: 20px 0;
    }

    .info-item strong {
      display: block;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .info-item span {
      color: var(--muted);
      font-size: 14px;
    }

    .form-card {
      background: white;
      border: 1px solid var(--border);
      padding: 40px;
      box-shadow: 0 15px 35px rgba(13,23,41,.07);
    }
